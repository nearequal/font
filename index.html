<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Zapid Font Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Zapid</h1>

  <!-- textarea 版 -->
  <textarea class="typing-area" placeholder="入力"></textarea>

  <h2>contenteditable</h2>
  <div class="typing-area" contenteditable="true">
    入力
  </div>
</body>
</html>
